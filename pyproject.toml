[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "commandcentre"
version = "0.5.0"
description = "CommandCentre Linux desktop launcher and Kanban"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pywebview",
  "PyQt6",
  "PyQt6-WebEngine",
  "qtpy",
  "pillow",
  "pynput",
  "pystray",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["commandcentre*"]
